manual_start:
  name: Avvia irrigazione manuale
  description: >
    Avvia manualmente l'irrigazione su una zona specifica per una durata definita.
    Trovi cloud_id e device_id negli attributi delle entità select
    "Rain Vision — Seleziona Hub Nuvola" e "Rain Vision — Seleziona Dispositivo".
  fields:
    cloud_id:
      name: Cloud ID (Nuvola)
      description: ID dell'hub Nuvola Vision (visibile negli attributi della select "Seleziona Hub Nuvola")
      required: true
      example: 1099
      selector:
        number:
          min: 1
          mode: box
    device_id:
      name: Device ID (Pure Vision)
      description: ID del dispositivo Pure Vision (visibile negli attributi della select "Seleziona Dispositivo")
      required: true
      example: 5644
      selector:
        number:
          min: 1
          mode: box
    zone:
      name: Zona
      description: Numero della zona da irrigare (1-8)
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 8
          step: 1
    duration_minutes:
      name: Durata (minuti)
      description: Per quanti minuti irrigare (default 10, max 120)
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: "min"

manual_stop:
  name: Ferma irrigazione manuale
  description: >
    Ferma immediatamente tutta l'irrigazione manuale in corso sul dispositivo.
  fields:
    cloud_id:
      name: Cloud ID (Nuvola)
      description: ID dell'hub Nuvola Vision
      required: true
      example: 1099
      selector:
        number:
          min: 1
          mode: box
    device_id:
      name: Device ID (Pure Vision)
      description: ID del dispositivo Pure Vision
      required: true
      example: 5644
      selector:
        number:
          min: 1
          mode: box

set_zone_duration:
  name: Imposta durata zona
  description: Modifica la durata di irrigazione di una zona in un programma.
  fields:
    device_puid:
      name: PUID dispositivo
      description: Il PUID del dispositivo Pure Vision
      required: true
      example: "1000005059"
      selector:
        text:
    program:
      name: Programma
      description: Lettera del programma da modificare (A-H)
      required: true
      example: "A"
      selector:
        select:
          options: ["A","B","C","D","E","F","G","H"]
    zone_id:
      name: ID Zona
      description: ID della zona (1=Zona1, 2=Zona2, 4=Zona3, 8=Zona4)
      required: true
      example: 1
      selector:
        select:
          options:
            - value: 1
              label: "Zona 1 (id=1)"
            - value: 2
              label: "Zona 2 (id=2)"
            - value: 4
              label: "Zona 3 (id=4)"
            - value: 8
              label: "Zona 4 (id=8)"
    duration_seconds:
      name: Durata (secondi)
      description: Durata in secondi (0 = disabilitata, max 7200)
      required: true
      example: 900
      selector:
        number:
          min: 0
          max: 7200
          step: 60
          unit_of_measurement: "s"

set_program_start_time:
  name: Imposta orario di partenza
  description: Modifica l'orario di partenza di uno slot temporale di un programma.
  fields:
    device_puid:
      name: PUID dispositivo
      required: true
      example: "1000005059"
      selector:
        text:
    program:
      name: Programma
      required: true
      example: "A"
      selector:
        select:
          options: ["A","B","C","D","E","F","G","H"]
    time_index:
      name: Indice slot orario
      description: Quale slot modificare (0 = primo, max 5)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 5
          step: 1
    time:
      name: Orario (HH:MM)
      required: true
      example: "06:00"
      selector:
        text:
    active:
      name: Attivo
      required: true
      example: true
      selector:
        boolean:

set_program_cycle:
  name: Imposta frequenza ciclo
  description: Modifica ogni quante ore riparte il programma.
  fields:
    device_puid:
      name: PUID dispositivo
      required: true
      example: "1000005059"
      selector:
        text:
    program:
      name: Programma
      required: true
      example: "A"
      selector:
        select:
          options: ["A","B","C","D","E","F","G","H"]
    cycle_hours:
      name: Frequenza (ore)
      required: true
      example: 24
      selector:
        number:
          min: 1
          max: 168
          step: 1
          unit_of_measurement: "h"

set_program_weekdays:
  name: Imposta giorni della settimana
  description: >
    Modifica i giorni in cui il programma è attivo.
    Indici: 1=Dom, 2=Lun, 3=Mar, 4=Mer, 5=Gio, 6=Ven, 7=Sab
  fields:
    device_puid:
      name: PUID dispositivo
      required: true
      example: "1000005059"
      selector:
        text:
    program:
      name: Programma
      required: true
      example: "A"
      selector:
        select:
          options: ["A","B","C","D","E","F","G","H"]
    weekdays:
      name: Giorni attivi
      description: Lista indici giorni (es. [2,4,6] = Lun/Mer/Ven)
      required: true
      example: [2, 4, 6]
      selector:
        object:

set_programs:
  name: Imposta programmi completi
  description: Invia un payload completo di tutti i programmi al dispositivo.
  fields:
    device_puid:
      name: PUID dispositivo
      required: true
      example: "1000005059"
      selector:
        text:
    programs:
      name: Programmi
      description: Lista completa dei programmi nel formato Rain Vision API
      required: true
      selector:
        object:
