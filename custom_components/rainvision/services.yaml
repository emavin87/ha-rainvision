set_zone_duration:
  name: Imposta durata zona
  description: >
    Modifica la durata di irrigazione di una zona all'interno di un programma.
    Recupera i programmi attuali, aggiorna solo la zona indicata e salva tutto.
  fields:
    device_puid:
      name: PUID dispositivo
      description: Il PUID del dispositivo Pure Vision (es. "1000005059")
      required: true
      example: "1000005059"
      selector:
        text:
    program:
      name: Programma
      description: Lettera del programma da modificare (A-H)
      required: true
      example: "A"
      selector:
        select:
          options: ["A","B","C","D","E","F","G","H"]
    zone_id:
      name: ID Zona
      description: ID della zona (1=Zona1, 2=Zona2, 4=Zona3, 8=Zona4)
      required: true
      example: 1
      selector:
        select:
          options:
            - value: 1
              label: "Zona 1 (id=1)"
            - value: 2
              label: "Zona 2 (id=2)"
            - value: 4
              label: "Zona 3 (id=4)"
            - value: 8
              label: "Zona 4 (id=8)"
    duration_seconds:
      name: Durata (secondi)
      description: Durata in secondi (0 = zona disabilitata, max 7200 = 2 ore)
      required: true
      example: 900
      selector:
        number:
          min: 0
          max: 7200
          step: 60
          unit_of_measurement: "s"

set_program_start_time:
  name: Imposta orario di partenza
  description: >
    Modifica l'orario di partenza di uno slot temporale di un programma.
    Ogni programma ha fino a 6 slot di orario (indice 0-5).
    Puoi anche attivare o disattivare lo slot.
  fields:
    device_puid:
      name: PUID dispositivo
      description: Il PUID del dispositivo Pure Vision (es. "1000005059")
      required: true
      example: "1000005059"
      selector:
        text:
    program:
      name: Programma
      description: Lettera del programma (A-H)
      required: true
      example: "A"
      selector:
        select:
          options: ["A","B","C","D","E","F","G","H"]
    time_index:
      name: Indice slot orario
      description: Quale slot modificare (0 = primo orario, 1 = secondo, ecc.)
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 5
          step: 1
    time:
      name: Orario
      description: Orario di partenza nel formato HH:MM (es. "06:00")
      required: true
      example: "06:00"
      selector:
        text:
    active:
      name: Attivo
      description: Se true, lo slot è abilitato; se false, viene ignorato
      required: true
      example: true
      selector:
        boolean:

set_program_cycle:
  name: Imposta frequenza ciclo
  description: >
    Modifica ogni quante ore riparte il programma (tipo ciclo).
    Ad esempio: 24 = ogni giorno, 48 = ogni 2 giorni, 6 = ogni 6 ore.
  fields:
    device_puid:
      name: PUID dispositivo
      description: Il PUID del dispositivo Pure Vision (es. "1000005059")
      required: true
      example: "1000005059"
      selector:
        text:
    program:
      name: Programma
      description: Lettera del programma (A-H)
      required: true
      example: "A"
      selector:
        select:
          options: ["A","B","C","D","E","F","G","H"]
    cycle_hours:
      name: Frequenza (ore)
      description: Ogni quante ore riparte il programma
      required: true
      example: 24
      selector:
        number:
          min: 1
          max: 168
          step: 1
          unit_of_measurement: "h"

set_program_weekdays:
  name: Imposta giorni della settimana
  description: >
    Modifica i giorni della settimana in cui il programma è attivo
    (solo per programmi di tipo settimanale, non ciclo).
  fields:
    device_puid:
      name: PUID dispositivo
      description: Il PUID del dispositivo Pure Vision (es. "1000005059")
      required: true
      example: "1000005059"
      selector:
        text:
    program:
      name: Programma
      description: Lettera del programma (A-H)
      required: true
      example: "A"
      selector:
        select:
          options: ["A","B","C","D","E","F","G","H"]
    weekdays:
      name: Giorni attivi
      description: >
        Lista degli indici dei giorni attivi.
        1=Domenica, 2=Lunedì, 3=Martedì, 4=Mercoledì, 5=Giovedì, 6=Venerdì, 7=Sabato
      required: true
      example: [2, 4, 6]
      selector:
        object:

set_programs:
  name: Imposta programmi completi
  description: >
    Invia un payload completo di programmi al dispositivo.
    Usare quando si vuole aggiornare più programmi contemporaneamente.
  fields:
    device_puid:
      name: PUID dispositivo
      description: Il PUID del dispositivo Pure Vision (es. "1000005059")
      required: true
      example: "1000005059"
      selector:
        text:
    programs:
      name: Programmi
      description: Lista completa dei programmi (A-H) nel formato Rain Vision API
      required: true
      selector:
        object:
