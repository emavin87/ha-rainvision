type: vertical-stack
cards:

  # ── Impostazioni ─────────────────────────────────────────────────────────────
  - type: entities
    title: "Programma B — Piante"
    entities:

      - entity: sensor.pure_vision_ev_programma_b_piante
        name: "Prossimo avvio"
        icon: mdi:clock-start

      - type: section
        label: "⚙️ Impostazioni"

      - entity: sensor.pure_vision_ev_programma_b_piante
        name: "Tipo"
        type: attribute
        attribute: type
        icon: mdi:cog

      - type: conditional
        conditions:
          - condition: state
            entity: sensor.pure_vision_ev_programma_b_piante
            attribute: type
            state: "cycle"
        row:
          entity: sensor.pure_vision_ev_programma_b_piante
          name: "Ciclo"
          type: attribute
          attribute: cycle
          icon: mdi:refresh
          suffix: " h"

      - entity: sensor.pure_vision_ev_programma_b_piante
        name: "Attivo"
        type: attribute
        attribute: active
        icon: mdi:toggle-switch

      - entity: sensor.pure_vision_ev_programma_b_piante
        name: "Durata totale"
        type: attribute
        attribute: total_duration_minutes
        icon: mdi:timer-outline
        suffix: " min"

  # ── Orari ─────────────────────────────────────────────────────────────────────
  - type: entities
    entities:
      - type: section
        label: "🕐 Orari"

  - type: grid
    columns: 1
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.pure_vision_ev_programma_b_piante
        name: "Orario 1"
        show_state: false
        show_label: true
        label: >
          [[[
            const a = entity.attributes;
            return `${a.times_0_time ?? '—'}  |  ${a.times_0_active ? '✅' : '❌'}`;
          ]]]
        icon: mdi:clock-outline
        styles:
          card:
            - border-radius: 8px
            - padding: 8px 12px
          name:
            - font-size: 11px
            - color: "var(--secondary-text-color)"
            - text-align: left
          label:
            - font-size: 14px
            - font-weight: bold
            - color: >
                [[[ return entity.attributes.times_0_active ? '#00838f' : '#aaaaaa' ]]]
            - text-align: right
            - flex-grow: 1
          icon:
            - color: >
                [[[ return entity.attributes.times_0_active ? '#00b5e2' : '#cccccc' ]]]
            - width: 20px

