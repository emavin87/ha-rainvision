type: entities
title: "Programma A — Prato"
entities:

  # Stato principale
  - entity: sensor.pure_vision_ev_programma_a_prato
    name: "Prossimo avvio"
    icon: mdi:clock-start

  # ── Impostazioni ────────────────────────────────────────────────────────────
  - type: section
    label: "⚙️ Impostazioni"

  - entity: sensor.pure_vision_ev_programma_a_prato
    name: "Tipo"
    type: attribute
    attribute: type
    icon: mdi:cog

  - type: conditional
    conditions:
      - condition: state
        entity: sensor.pure_vision_ev_programma_a_prato
        attribute: type
        state: "cycle"
    row:
      entity: sensor.pure_vision_ev_programma_a_prato
      name: "Ciclo"
      type: attribute
      attribute: cycle
      icon: mdi:refresh
      suffix: " h"

  - entity: sensor.pure_vision_ev_programma_a_prato
    name: "Attivo"
    type: attribute
    attribute: active
    icon: mdi:toggle-switch

  - entity: sensor.pure_vision_ev_programma_a_prato
    name: "Even"
    type: attribute
    attribute: even
    icon: mdi:code-tags

  - entity: sensor.pure_vision_ev_programma_a_prato
    name: "Durata totale"
    type: attribute
    attribute: total_duration_minutes
    icon: mdi:timer-outline
    suffix: " min"

  # ── Orari ───────────────────────────────────────────────────────────────────
  - type: section
    label: "🕐 Orari"

  - type: custom:button-card
    entity: sensor.pure_vision_ev_programma_a_prato
    name: "Orario 1"
    show_state: false
    show_label: true
    label: >
      [[[
        const attrs = entity.attributes;
        const time   = attrs.times_0_time   ?? "—";
        const active = attrs.times_0_active ? "✅" : "❌";
        return `${time}  ${active}`;
      ]]]
    icon: mdi:clock-outline
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border-bottom: "1px solid var(--divider-color)"
        - border-radius: 0
        - padding: 4px 0
      name:
        - font-size: 14px
        - color: "var(--primary-text-color)"
        - text-align: left
      label:
        - font-size: 14px
        - color: "var(--secondary-text-color)"
        - text-align: right
        - flex-grow: 1
      icon:
        - width: 24px
        - color: "var(--state-icon-color)"

