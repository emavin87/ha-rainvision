title: 🌱 Irrigazione Rain Vision
type: grid
cards:

  # ════════════════════════════════════════════════════════════════════════════
  # INTESTAZIONE
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:button-card
    name: "🌱 Rain Vision — Gestione Programmi"
    icon: mdi:sprinkler-variant
    show_state: false
    styles:
      card:
        - background: "linear-gradient(135deg, #2d7a3a, #8dc63f)"
        - color: white
        - font-size: 16px
        - font-weight: bold
        - padding: 16px
        - border-radius: 12px
      icon:
        - color: white
        - width: 28px

  # ════════════════════════════════════════════════════════════════════════════
  # STATO DISPOSITIVO
  # ════════════════════════════════════════════════════════════════════════════
  - type: entities
    title: "📡 Stato dispositivo"
    show_header_toggle: false
    entities:
      - entity: sensor.pure_vision_ev_battery
        name: Batteria Pure Vision
        icon: mdi:battery
      - entity: sensor.nuvola_vision_ev_battery
        name: Batteria Nuvola
        icon: mdi:battery-charging
      - entity: sensor.pure_vision_ev_status
        name: Stato
        icon: mdi:wifi
      - entity: sensor.pure_vision_ev_meteo_pause
        name: Pausa meteo
        icon: mdi:weather-rainy
      - entity: sensor.pure_vision_ev_active_programs
        name: Programmi attivi
        icon: mdi:calendar-check
      - entity: sensor.nuvola_vision_ev_last_scanned
        name: Ultima scansione BLE
        icon: mdi:bluetooth-connect
      - entity: sensor.pure_vision_ev_last_updated
        name: Ultimo aggiornamento
        icon: mdi:clock-check-outline
      - entity: sensor.pure_vision_ev_realtime_timestamp
        name: Timestamp real-time
        icon: mdi:antenna

  # ════════════════════════════════════════════════════════════════════════════
  # PROGRAMMA A — PRATO
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:button-card
    name: "Programma A — Prato"
    icon: mdi:calendar-clock
    show_state: false
    styles:
      card:
        - background: "#1a3a20"
        - color: "#8dc63f"
        - font-size: 14px
        - font-weight: bold
        - padding: 10px 16px
        - border-radius: 12px
      icon:
        - color: "#8dc63f"

  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.pure_vision_ev_programma_a_prato
        name: Prossimo avvio
        icon: mdi:clock-start
      - type: attribute
        entity: sensor.pure_vision_ev_programma_a_prato
        attribute: type
        name: Tipo
        icon: mdi:cog
      - type: attribute
        entity: sensor.pure_vision_ev_programma_a_prato
        attribute: cycle
        name: Ciclo (ore)
        icon: mdi:refresh
        suffix: " h"
      - type: attribute
        entity: sensor.pure_vision_ev_programma_a_prato
        attribute: total_duration_minutes
        name: Durata totale
        icon: mdi:timer-outline
        suffix: " min"

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        name: "Prato 1"
        label: >
          [[[ return (states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.zones_0_duration_minutes ?? '?') + ' min' ]]]
        show_label: true
        icon: mdi:sprinkler
        styles:
          card:
            - background: "#e8f5e9"
            - border: "1px solid #8dc63f"
            - border-radius: 10px
            - padding: 10px 4px
          name:
            - font-size: 11px
            - color: "#2d7a3a"
          label:
            - font-size: 13px
            - font-weight: bold
            - color: "#2d7a3a"
          icon:
            - color: "#8dc63f"
            - width: 22px

      - type: custom:button-card
        name: "Prato 2"
        label: >
          [[[ return (states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.zones_1_duration_minutes ?? '?') + ' min' ]]]
        show_label: true
        icon: mdi:sprinkler
        styles:
          card:
            - background: "#e8f5e9"
            - border: "1px solid #8dc63f"
            - border-radius: 10px
            - padding: 10px 4px
          name:
            - font-size: 11px
            - color: "#2d7a3a"
          label:
            - font-size: 13px
            - font-weight: bold
            - color: "#2d7a3a"
          icon:
            - color: "#8dc63f"
            - width: 22px

      - type: custom:button-card
        name: "Piante"
        label: >
          [[[ return (states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.zones_2_duration_minutes ?? '?') + ' min' ]]]
        show_label: true
        icon: mdi:flower
        styles:
          card:
            - background: "#f5f5f5"
            - border: "1px solid #cccccc"
            - border-radius: 10px
            - padding: 10px 4px
          name:
            - font-size: 11px
            - color: "#777777"
          label:
            - font-size: 13px
            - font-weight: bold
            - color: "#777777"
          icon:
            - color: "#cccccc"
            - width: 22px

      - type: custom:button-card
        name: "Orto"
        label: >
          [[[ return (states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.zones_3_duration_minutes ?? '?') + ' min' ]]]
        show_label: true
        icon: mdi:sprout
        styles:
          card:
            - background: "#f5f5f5"
            - border: "1px solid #cccccc"
            - border-radius: 10px
            - padding: 10px 4px
          name:
            - font-size: 11px
            - color: "#777777"
          label:
            - font-size: 13px
            - font-weight: bold
            - color: "#777777"
          icon:
            - color: "#cccccc"
            - width: 22px

  - type: grid
    columns: 2
    square: false
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - type: attribute
            entity: sensor.pure_vision_ev_programma_a_prato
            attribute: times_0_time
            name: "Orario 1"
            icon: mdi:clock-outline
          - type: attribute
            entity: sensor.pure_vision_ev_programma_a_prato
            attribute: times_0_active
            name: "Orario 1 attivo"
            icon: mdi:check-circle-outline
          - type: attribute
            entity: sensor.pure_vision_ev_programma_a_prato
            attribute: times_1_time
            name: "Orario 2"
            icon: mdi:clock-outline
          - type: attribute
            entity: sensor.pure_vision_ev_programma_a_prato
            attribute: times_1_active
            name: "Orario 2 attivo"
            icon: mdi:check-circle-outline

      - type: entities
        show_header_toggle: false
        entities:
          - type: attribute
            entity: sensor.pure_vision_ev_programma_a_prato
            attribute: weekdays_0_name
            name: "Giorno 1"
            icon: mdi:calendar-week
          - type: attribute
            entity: sensor.pure_vision_ev_programma_a_prato
            attribute: weekdays_0_is_checked
            name: "Attivo"
            icon: mdi:check-circle-outline
          - type: attribute
            entity: sensor.pure_vision_ev_programma_a_prato
            attribute: weekdays_1_name
            name: "Giorno 2"
            icon: mdi:calendar-week
          - type: attribute
            entity: sensor.pure_vision_ev_programma_a_prato
            attribute: weekdays_1_is_checked
            name: "Attivo"
            icon: mdi:check-circle-outline

  - type: custom:button-card
    name: "On/Off Programma A"
    entity: switch.pure_vision_ev_programma_a_prato
    show_state: true
    icon: mdi:toggle-switch
    state:
      - value: "on"
        styles:
          card:
            - background: "#e8f5e9"
            - border: "1px solid #8dc63f"
          name:
            - color: "#2d7a3a"
          icon:
            - color: "#8dc63f"
      - value: "off"
        styles:
          card:
            - background: "#ffebee"
            - border: "1px solid #ef9a9a"
          name:
            - color: "#c62828"
          icon:
            - color: "#ef9a9a"
    styles:
      card:
        - border-radius: 10px
        - padding: 10px
      name:
        - font-size: 13px
        - font-weight: bold
      icon:
        - width: 22px
    tap_action:
      action: toggle

  # ════════════════════════════════════════════════════════════════════════════
  # PROGRAMMA B — PIANTE
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:button-card
    name: "Programma B — Piante"
    icon: mdi:calendar-clock
    show_state: false
    styles:
      card:
        - background: "#1a3a20"
        - color: "#8dc63f"
        - font-size: 14px
        - font-weight: bold
        - padding: 10px 16px
        - border-radius: 12px
      icon:
        - color: "#8dc63f"

  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.pure_vision_ev_programma_b_piante
        name: Prossimo avvio
        icon: mdi:clock-start
      - type: attribute
        entity: sensor.pure_vision_ev_programma_b_piante
        attribute: type
        name: Tipo
        icon: mdi:cog
      - type: attribute
        entity: sensor.pure_vision_ev_programma_b_piante
        attribute: cycle
        name: Ciclo (ore)
        icon: mdi:refresh
        suffix: " h"
      - type: attribute
        entity: sensor.pure_vision_ev_programma_b_piante
        attribute: total_duration_minutes
        name: Durata totale
        icon: mdi:timer-outline
        suffix: " min"

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        name: "Prato 1"
        label: >
          [[[ return (states['sensor.pure_vision_ev_programma_b_piante']?.attributes?.zones_0_duration_minutes ?? '?') + ' min' ]]]
        show_label: true
        icon: mdi:sprinkler
        styles:
          card:
            - background: "#f5f5f5"
            - border: "1px solid #cccccc"
            - border-radius: 10px
            - padding: 10px 4px
          name:
            - font-size: 11px
            - color: "#777777"
          label:
            - font-size: 13px
            - font-weight: bold
            - color: "#777777"
          icon:
            - color: "#cccccc"
            - width: 22px

      - type: custom:button-card
        name: "Prato 2"
        label: >
          [[[ return (states['sensor.pure_vision_ev_programma_b_piante']?.attributes?.zones_1_duration_minutes ?? '?') + ' min' ]]]
        show_label: true
        icon: mdi:sprinkler
        styles:
          card:
            - background: "#f5f5f5"
            - border: "1px solid #cccccc"
            - border-radius: 10px
            - padding: 10px 4px
          name:
            - font-size: 11px
            - color: "#777777"
          label:
            - font-size: 13px
            - font-weight: bold
            - color: "#777777"
          icon:
            - color: "#cccccc"
            - width: 22px

      - type: custom:button-card
        name: "Piante"
        label: >
          [[[ return (states['sensor.pure_vision_ev_programma_b_piante']?.attributes?.zones_2_duration_minutes ?? '?') + ' min' ]]]
        show_label: true
        icon: mdi:flower
        styles:
          card:
            - background: "#e8f5e9"
            - border: "1px solid #8dc63f"
            - border-radius: 10px
            - padding: 10px 4px
          name:
            - font-size: 11px
            - color: "#2d7a3a"
          label:
            - font-size: 13px
            - font-weight: bold
            - color: "#2d7a3a"
          icon:
            - color: "#8dc63f"
            - width: 22px

      - type: custom:button-card
        name: "Orto"
        label: >
          [[[ return (states['sensor.pure_vision_ev_programma_b_piante']?.attributes?.zones_3_duration_minutes ?? '?') + ' min' ]]]
        show_label: true
        icon: mdi:sprout
        styles:
          card:
            - background: "#f5f5f5"
            - border: "1px solid #cccccc"
            - border-radius: 10px
            - padding: 10px 4px
          name:
            - font-size: 11px
            - color: "#777777"
          label:
            - font-size: 13px
            - font-weight: bold
            - color: "#777777"
          icon:
            - color: "#cccccc"
            - width: 22px

  - type: custom:button-card
    name: "On/Off Programma B"
    entity: switch.pure_vision_ev_programma_b_piante
    show_state: true
    icon: mdi:toggle-switch
    state:
      - value: "on"
        styles:
          card:
            - background: "#e8f5e9"
            - border: "1px solid #8dc63f"
          name:
            - color: "#2d7a3a"
          icon:
            - color: "#8dc63f"
      - value: "off"
        styles:
          card:
            - background: "#ffebee"
            - border: "1px solid #ef9a9a"
          name:
            - color: "#c62828"
          icon:
            - color: "#ef9a9a"
    styles:
      card:
        - border-radius: 10px
        - padding: 10px
      name:
        - font-size: 13px
        - font-weight: bold
      icon:
        - width: 22px
    tap_action:
      action: toggle

  # ════════════════════════════════════════════════════════════════════════════
  # MODIFICA PROGRAMMA
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:button-card
    name: "✏️ Modifica Programma"
    icon: mdi:pencil-circle
    show_state: false
    styles:
      card:
        - background: "linear-gradient(135deg, #1a3a20, #2d7a3a)"
        - color: white
        - font-size: 15px
        - font-weight: bold
        - padding: 14px
        - border-radius: 12px
      icon:
        - color: white
        - width: 26px

  - type: entities
    title: "Seleziona"
    show_header_toggle: false
    entities:
      - entity: input_select.rainvision_programma
        name: Programma
        icon: mdi:calendar-clock
      - entity: input_select.rainvision_zona
        name: Zona (ID)
        icon: mdi:sprinkler

  - type: entities
    title: "💧 Durata zona"
    show_header_toggle: false
    entities:
      - entity: input_number.rainvision_durata_min
        name: Durata (minuti)
        icon: mdi:timer-outline

  - type: custom:button-card
    name: "💾 Salva durata zona"
    icon: mdi:content-save
    show_state: false
    styles:
      card:
        - background: "#2d7a3a"
        - border-radius: 10px
        - padding: 12px
      name:
        - color: white
        - font-size: 13px
        - font-weight: bold
      icon:
        - color: white
        - width: 22px
    tap_action:
      action: call-service
      service: rainvision.set_zone_duration
      service_data:
        device_puid: "1000005059"
        program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
        zone_id: "[[[ return parseInt(states['input_select.rainvision_zona'].state) ]]]"
        duration_seconds: "[[[ return parseInt(states['input_number.rainvision_durata_min'].state) * 60 ]]]"

  - type: entities
    title: "🕐 Orario di avvio"
    show_header_toggle: false
    entities:
      - entity: input_text.rainvision_orario
        name: Orario (HH:MM)
        icon: mdi:clock-outline
      - entity: input_number.rainvision_time_index
        name: Slot orario (0-5)
        icon: mdi:numeric

  - type: custom:button-card
    name: "💾 Salva orario di avvio"
    icon: mdi:clock-check
    show_state: false
    styles:
      card:
        - background: "#00838f"
        - border-radius: 10px
        - padding: 12px
      name:
        - color: white
        - font-size: 13px
        - font-weight: bold
      icon:
        - color: white
        - width: 22px
    tap_action:
      action: call-service
      service: rainvision.set_program_start_time
      service_data:
        device_puid: "1000005059"
        program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
        time_index: "[[[ return parseInt(states['input_number.rainvision_time_index'].state) ]]]"
        time: "[[[ return states['input_text.rainvision_orario'].state ]]]"
        active: true

  - type: entities
    title: "🔄 Tipo schedulazione e ciclo"
    show_header_toggle: false
    entities:
      - entity: input_select.rainvision_tipo_ciclo
        name: Tipo schedulazione
        icon: mdi:calendar-sync
      - entity: input_number.rainvision_ciclo_ore
        name: Ogni quante ore (se tipo = cycle)
        icon: mdi:refresh

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        name: "💾 Salva tipo"
        icon: mdi:calendar-sync
        show_state: false
        styles:
          card:
            - background: "#6a1b9a"
            - border-radius: 10px
            - padding: 12px
          name:
            - color: white
            - font-size: 12px
            - font-weight: bold
          icon:
            - color: white
            - width: 22px
        tap_action:
          action: call-service
          service: rainvision.set_program_cycle
          service_data:
            device_puid: "1000005059"
            program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
            cycle_hours: "[[[ return parseInt(states['input_number.rainvision_ciclo_ore'].state) ]]]"

      - type: custom:button-card
        name: "💾 Salva ciclo (ore)"
        icon: mdi:refresh-circle
        show_state: false
        styles:
          card:
            - background: "#e65100"
            - border-radius: 10px
            - padding: 12px
          name:
            - color: white
            - font-size: 12px
            - font-weight: bold
          icon:
            - color: white
            - width: 22px
        tap_action:
          action: call-service
          service: rainvision.set_program_cycle
          service_data:
            device_puid: "1000005059"
            program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
            cycle_hours: "[[[ return parseInt(states['input_number.rainvision_ciclo_ore'].state) ]]]"

  # ════════════════════════════════════════════════════════════════════════════
  # IRRIGAZIONE MANUALE
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:button-card
    name: "💧 Irrigazione Manuale"
    icon: mdi:water
    show_state: false
    styles:
      card:
        - background: "#00838f"
        - color: white
        - font-size: 14px
        - font-weight: bold
        - padding: 10px 16px
        - border-radius: 12px
      icon:
        - color: white

  - type: grid
    columns: 2
    square: false
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            name: "Prato 1"
            label: "10 min"
            show_label: true
            icon: mdi:sprinkler
            styles:
              card:
                - background: "#e3f2fd"
                - border: "1px solid #00b5e2"
                - border-radius: 10px
                - padding: 10px 4px
              name:
                - font-size: 11px
                - color: "#00838f"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#00838f"
              icon:
                - color: "#00b5e2"
                - width: 22px
            tap_action:
              action: call-service
              service: rainvision.manual_start
              service_data:
                device_puid: "1000005059"
                zone_progressive: 1
                duration_minutes: 10

          - type: custom:button-card
            name: "Prato 2"
            label: "10 min"
            show_label: true
            icon: mdi:sprinkler
            styles:
              card:
                - background: "#e3f2fd"
                - border: "1px solid #00b5e2"
                - border-radius: 10px
                - padding: 10px 4px
              name:
                - font-size: 11px
                - color: "#00838f"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#00838f"
              icon:
                - color: "#00b5e2"
                - width: 22px
            tap_action:
              action: call-service
              service: rainvision.manual_start
              service_data:
                device_puid: "1000005059"
                zone_progressive: 2
                duration_minutes: 10

          - type: custom:button-card
            name: "Piante"
            label: "10 min"
            show_label: true
            icon: mdi:flower
            styles:
              card:
                - background: "#e3f2fd"
                - border: "1px solid #00b5e2"
                - border-radius: 10px
                - padding: 10px 4px
              name:
                - font-size: 11px
                - color: "#00838f"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#00838f"
              icon:
                - color: "#00b5e2"
                - width: 22px
            tap_action:
              action: call-service
              service: rainvision.manual_start
              service_data:
                device_puid: "1000005059"
                zone_progressive: 3
                duration_minutes: 10

          - type: custom:button-card
            name: "Orto"
            label: "10 min"
            show_label: true
            icon: mdi:sprout
            styles:
              card:
                - background: "#e3f2fd"
                - border: "1px solid #00b5e2"
                - border-radius: 10px
                - padding: 10px 4px
              name:
                - font-size: 11px
                - color: "#00838f"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#00838f"
              icon:
                - color: "#00b5e2"
                - width: 22px
            tap_action:
              action: call-service
              service: rainvision.manual_start
              service_data:
                device_puid: "1000005059"
                zone_progressive: 4
                duration_minutes: 10

      - type: custom:button-card
        name: "STOP"
        label: "Ferma tutto"
        show_label: true
        icon: mdi:stop-circle
        styles:
          card:
            - background: "#c62828"
            - border-radius: 10px
            - padding: 16px 4px
          name:
            - font-size: 13px
            - color: white
            - font-weight: bold
          label:
            - font-size: 11px
            - color: "rgba(255,255,255,0.8)"
          icon:
            - color: white
            - width: 32px
        tap_action:
          action: call-service
          service: rainvision.manual_stop
          service_data:
            device_puid: "1000005059"
