title: 📅 Programmi
type: grid
cards:

  # ════════════════════════════════════════════════════════════════════════════
  # PROGRAMMA A — PRATO
  # ════════════════════════════════════════════════════════════════════════════
  - type: custom:layout-card
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: repeat(3, 1fr)
      grid-template-rows: auto
      gap: 8px
    cards:

      - type: custom:button-card
        name: "Programma A — Prato"
        icon: mdi:calendar-clock
        show_state: false
        view_layout:
          grid-column: 1 / -1
        styles:
          card:
            - background: "#1a3a20"
            - color: "#8dc63f"
            - font-size: 14px
            - font-weight: bold
            - padding: 10px 16px
            - border-radius: 12px
          icon:
            - color: "#8dc63f"

      - type: custom:button-card
        entity: sensor.pure_vision_ev_programma_a_prato
        name: "Prossimo avvio"
        show_state: true
        icon: mdi:clock-start
        view_layout:
          grid-column: 1 / -1
        styles:
          card:
            - background: "#e8f5e9"
            - border: "1px solid #8dc63f"
            - border-radius: 10px
            - padding: 10px
          name:
            - font-size: 11px
            - color: "#2d7a3a"
          state:
            - font-size: 18px
            - font-weight: bold
            - color: "#1a3a20"
          icon:
            - color: "#8dc63f"
            - width: 22px

      - type: custom:button-card
        name: "Tipo"
        show_label: true
        show_state: false
        icon: mdi:cog
        label: "[[[ return states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.type ?? '—' ]]]"
        styles:
          card:
            - background: "#f5f5f5"
            - border: "1px solid #dddddd"
            - border-radius: 10px
            - padding: 12px 6px
          name:
            - font-size: 11px
            - color: "#777777"
          label:
            - font-size: 14px
            - font-weight: bold
            - color: "#333333"
          icon:
            - color: "#aaaaaa"
            - width: 18px

      - type: custom:button-card
        name: "Ciclo"
        show_label: true
        show_state: false
        icon: mdi:refresh
        label: "[[[ return (states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.cycle ?? '—') + ' h' ]]]"
        styles:
