            - background: "#fff8e1"
            - border: "1px solid #f9a825"
            - border-radius: 10px
            - padding: 12px 6px
          name:
            - font-size: 11px
            - color: "#e65100"
          label:
            - font-size: 14px
            - font-weight: bold
            - color: "#e65100"
          icon:
            - color: "#f9a825"
            - width: 18px

