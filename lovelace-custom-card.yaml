        icon: mdi:water
        show_state: false
        styles:
          card:
            - background: "#00838f"
            - color: white
            - font-size: 14px
            - font-weight: bold
            - padding: 10px 16px
            - border-radius: "12px 12px 0 0"
          icon:
            - color: white

      - type: grid
        columns: 2
        square: false
        cards:
          - type: grid
            columns: 2
            square: false
