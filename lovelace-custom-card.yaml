# Rain Vision — Custom card per modifica programmi
# Richiede: button-card (HACS → Frontend)
# Incolla in Dashboard → Modifica → Aggiungi card → Editor manuale

type: vertical-stack
cards:

  # ── Intestazione ─────────────────────────────────────────────────────────────
  - type: custom:button-card
    name: "🌱 Rain Vision — Gestione Programmi"
    icon: mdi:sprinkler-variant
    show_state: false
    styles:
      card:
        - background: "linear-gradient(135deg, #2d7a3a, #8dc63f)"
        - color: white
        - font-size: 16px
        - font-weight: bold
        - padding: 16px
        - border-radius: 12px
      icon:
        - color: white
        - width: 28px

  # ── Programma A ───────────────────────────────────────────────────────────────
  - type: vertical-stack
    cards:
      - type: custom:button-card
        name: "Programma A — Prato"
        icon: mdi:calendar-clock
        show_state: false
        styles:
          card:
            - background: "#1a3a20"
            - color: "#8dc63f"
            - font-size: 14px
            - font-weight: bold
            - padding: 10px 16px
            - border-radius: "12px 12px 0 0"
            - margin-bottom: 0px
          icon:
            - color: "#8dc63f"

      - type: entities
        show_header_toggle: false
        style: |
          ha-card {
            border-radius: 0 0 12px 12px;
            margin-top: 0;
          }
        entities:
          - entity: sensor.pure_vision_ev_programma_a_prato
            name: Prossimo avvio
            icon: mdi:clock-start

      - type: grid
        columns: 4
        square: false
        cards:
          # Zona 1
          - type: custom:button-card
            name: "Prato 1"
            label: "15 min"
            show_label: true
            show_state: false
            icon: mdi:sprinkler
            styles:
              card:
                - background: "#e8f5e9"
                - border: "1px solid #8dc63f"
                - border-radius: 10px
                - padding: 10px 4px
              name:
                - font-size: 11px
                - color: "#2d7a3a"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#2d7a3a"
              icon:
                - color: "#8dc63f"
                - width: 22px
            tap_action:
              action: call-service
              service: rainvision.set_zone_duration
              service_data:
                device_puid: "1000005059"
                program: "A"
                zone_id: 1
                duration_seconds: 900

          # Zona 2
          - type: custom:button-card
            name: "Prato 2"
            label: "20 min"
            show_label: true
            show_state: false
            icon: mdi:sprinkler
            styles:
              card:
                - background: "#e8f5e9"
                - border: "1px solid #8dc63f"
                - border-radius: 10px
                - padding: 10px 4px
              name:
                - font-size: 11px
                - color: "#2d7a3a"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#2d7a3a"
              icon:
                - color: "#8dc63f"
                - width: 22px
            tap_action:
              action: call-service
              service: rainvision.set_zone_duration
              service_data:
                device_puid: "1000005059"
                program: "A"
                zone_id: 2
                duration_seconds: 1200

          # Zona 3
          - type: custom:button-card
            name: "Piante"
            label: "0 min"
            show_label: true
            show_state: false
            icon: mdi:flower
            styles:
              card:
                - background: "#f5f5f5"
                - border: "1px solid #cccccc"
                - border-radius: 10px
                - padding: 10px 4px
              name:
                - font-size: 11px
                - color: "#777777"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#777777"
              icon:
                - color: "#cccccc"
                - width: 22px
            tap_action:
              action: call-service
              service: rainvision.set_zone_duration
              service_data:
                device_puid: "1000005059"
                program: "A"
                zone_id: 4
                duration_seconds: 0

          # Zona 4
          - type: custom:button-card
            name: "Orto"
            label: "0 min"
            show_label: true
            show_state: false
            icon: mdi:sprout
            styles:
              card:
                - background: "#f5f5f5"
                - border: "1px solid #cccccc"
                - border-radius: 10px
                - padding: 10px 4px
              name:
                - font-size: 11px
                - color: "#777777"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#777777"
              icon:
                - color: "#cccccc"
                - width: 22px
            tap_action:
              action: call-service
              service: rainvision.set_zone_duration
              service_data:
                device_puid: "1000005059"
                program: "A"
                zone_id: 8
                duration_seconds: 0

      # Orari programma A
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:button-card
            name: "Orario 1"
            label: "06:30 ✓"
            show_label: true
            show_state: false
            icon: mdi:clock-outline
            styles:
              card:
                - background: "#e3f2fd"
                - border: "1px solid #00b5e2"
                - border-radius: 10px
                - padding: 8px 4px
              name:
                - font-size: 11px
                - color: "#00838f"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#00838f"
              icon:
                - color: "#00b5e2"
                - width: 20px
            tap_action:
              action: call-service
              service: rainvision.set_program_start_time
              service_data:
                device_puid: "1000005059"
                program: "A"
                time_index: 0
                time: "06:30"
                active: true

          - type: custom:button-card
            name: "Ciclo"
            label: "48h"
            show_label: true
            show_state: false
            icon: mdi:refresh
            styles:
              card:
                - background: "#fff8e1"
                - border: "1px solid #f9a825"
                - border-radius: 10px
                - padding: 8px 4px
              name:
                - font-size: 11px
                - color: "#e65100"
              label:
                - font-size: 13px
                - font-weight: bold
                - color: "#e65100"
              icon:
                - color: "#f9a825"
                - width: 20px
            tap_action:
              action: call-service
              service: rainvision.set_program_cycle
              service_data:
                device_puid: "1000005059"
                program: "A"
                cycle_hours: 48

          - type: custom:button-card
            name: "On/Off"
            entity: switch.pure_vision_ev_programma_a_prato
            show_state: true
            icon: mdi:toggle-switch
            state:
              - value: "on"
                styles:
                  card:
                    - background: "#e8f5e9"
                    - border: "1px solid #8dc63f"
                  name:
                    - color: "#2d7a3a"
                  icon:
                    - color: "#8dc63f"
              - value: "off"
                styles:
                  card:
                    - background: "#ffebee"
                    - border: "1px solid #ef9a9a"
                  name:
                    - color: "#c62828"
                  icon:
                    - color: "#ef9a9a"
            styles:
              card:
                - border-radius: 10px
                - padding: 8px 4px
              name:
                - font-size: 11px
              icon:
                - width: 20px
            tap_action:
              action: toggle

