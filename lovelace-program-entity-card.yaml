# Rain Vision — Entity card completa per un programma
# Sostituisci "a_prato" con il nome del tuo programma
# es: program_b_piante, program_c_orto, program_d

type: entities
title: "Programma A — Prato"
icon: mdi:calendar-clock
entities:

  # Stato principale (prossimo orario di avvio)
  - entity: sensor.pure_vision_ev_programma_a_prato
    name: Prossimo avvio
    icon: mdi:clock-start

  # ── Impostazioni ────────────────────────────────────────────────────────────
  - type: section
    label: Impostazioni

  - type: attribute
    entity: sensor.pure_vision_ev_programma_a_prato
    attribute: type
    name: Tipo
    icon: mdi:cog

  - type: attribute
    entity: sensor.pure_vision_ev_programma_a_prato
    attribute: cycle
    name: Ciclo (ore)
    icon: mdi:refresh
    suffix: " h"

  - type: attribute
    entity: sensor.pure_vision_ev_programma_a_prato
    attribute: active
    name: Programma attivo
    icon: mdi:toggle-switch

  - type: attribute
    entity: sensor.pure_vision_ev_programma_a_prato
    attribute: total_duration_minutes
    name: Durata totale
    icon: mdi:timer-outline
    suffix: " min"

  - type: attribute
    entity: sensor.pure_vision_ev_programma_a_prato
    attribute: even
    name: Even (bitmask)
    icon: mdi:code-tags

  # ── Orari (times) ────────────────────────────────────────────────────────────
  - type: section
    label: Orari

  - type: attribute
    entity: sensor.pure_vision_ev_programma_a_prato
    attribute: times_0_time
    name: "Orario 1 — time"
    icon: mdi:clock-outline

  - type: attribute
    entity: sensor.pure_vision_ev_programma_a_prato
    attribute: times_0_active
    name: "Orario 1 — active"
    icon: mdi:check-circle-outline

  - type: attribute
    entity: sensor.pure_vision_ev_programma_a_prato
