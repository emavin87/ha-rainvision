# ─────────────────────────────────────────────────────────────────────────────
# Rain Vision — Sezione modifica programma
# Incolla questo blocco dentro la tua section esistente
# Richiede: button-card (HACS) e gli helper in helpers.yaml
# ─────────────────────────────────────────────────────────────────────────────

title: ✏️ Modifica Programma
type: grid
cards:

  # ── Intestazione ─────────────────────────────────────────────────────────
  - type: custom:button-card
    name: "✏️ Modifica Programma"
    icon: mdi:pencil-circle
    show_state: false
    styles:
      card:
        - background: "linear-gradient(135deg, #1a3a20, #2d7a3a)"
        - color: white
        - font-size: 15px
        - font-weight: bold
        - padding: 14px
        - border-radius: 12px
      icon:
        - color: white
        - width: 26px

  # ── Selezione programma e zona ────────────────────────────────────────────
  - type: entities
    title: "🎯 Seleziona"
    show_header_toggle: false
    entities:
      - entity: input_select.rainvision_programma
        name: Programma
        icon: mdi:calendar-clock
      - entity: input_select.rainvision_zona
        name: Zona (ID)
        icon: mdi:sprinkler

  # ── Stato attuale del programma selezionato ───────────────────────────────
  - type: custom:button-card
    name: "Stato attuale"
    icon: mdi:information-outline
    show_state: false
    show_label: true
    label: >
      [[[
        const prog = states['input_select.rainvision_programma']?.state;
        if (!prog) return 'Seleziona un programma';
        const map = { A: 'a_prato', B: 'b_piante', C: 'c_orto', D: 'd' };
        const key = map[prog];
        const entity = states[`sensor.pure_vision_ev_programma_${key}`];
        if (!entity) return 'Sensore non trovato';
        const attrs = entity.attributes;
        const zona = states['input_select.rainvision_zona']?.state;
        const zoneMap = { '1': 0, '2': 1, '4': 2, '8': 3 };
        const zIdx = zoneMap[zona] ?? 0;
        const durMin = attrs[`zones_${zIdx}_duration_minutes`] ?? '?';
        const zoneName = attrs[`zones_${zIdx}_name`] ?? `Zona ${zona}`;
        return `Prog ${prog} | ${zoneName}: ${durMin} min | Ciclo: ${attrs.cycle ?? '?'}h | ${entity.state}`;
      ]]]
    styles:
      card:
        - background: "#e8f5e9"
        - border: "1px solid #8dc63f"
        - border-radius: 10px
        - padding: 12px
      name:
        - font-size: 12px
        - color: "#2d7a3a"
        - font-weight: bold
      label:
        - font-size: 12px
        - color: "#1a3a20"
      icon:
        - color: "#8dc63f"
        - width: 20px

  # ── Modifica durata zona ───────────────────────────────────────────────────
  - type: entities
    title: "💧 Durata zona"
    show_header_toggle: false
    entities:
      - entity: input_number.rainvision_durata_min
        name: Durata (minuti)
        icon: mdi:timer-outline

  - type: custom:button-card
    name: "💾 Salva durata zona"
    icon: mdi:content-save
    show_state: false
    styles:
      card:
        - background: "#2d7a3a"
        - border-radius: 10px
        - padding: 12px
      name:
        - color: white
        - font-size: 13px
        - font-weight: bold
      icon:
        - color: white
        - width: 22px
    tap_action:
      action: call-service
      service: rainvision.set_zone_duration
      service_data:
        device_puid: "1000005059"
        program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
        zone_id: "[[[ return parseInt(states['input_select.rainvision_zona'].state) ]]]"
        duration_seconds: "[[[ return parseInt(states['input_number.rainvision_durata_min'].state) * 60 ]]]"

  # ── Modifica orario di avvio ───────────────────────────────────────────────
  - type: entities
    title: "🕐 Orario di avvio"
    show_header_toggle: false
    entities:
      - entity: input_text.rainvision_orario
        name: Orario (HH:MM)
        icon: mdi:clock-outline
      - entity: input_number.rainvision_time_index
        name: Slot orario (0-5)
        icon: mdi:numeric

  - type: custom:button-card
    name: "💾 Salva orario di avvio"
    icon: mdi:clock-check
    show_state: false
    styles:
      card:
        - background: "#00838f"
        - border-radius: 10px
        - padding: 12px
      name:
        - color: white
        - font-size: 13px
        - font-weight: bold
      icon:
        - color: white
        - width: 22px
    tap_action:
      action: call-service
      service: rainvision.set_program_start_time
      service_data:
        device_puid: "1000005059"
        program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
        time_index: "[[[ return parseInt(states['input_number.rainvision_time_index'].state) ]]]"
        time: "[[[ return states['input_text.rainvision_orario'].state ]]]"
        active: true

  # ── Modifica tipo schedulazione e ciclo ────────────────────────────────────
  - type: entities
    title: "🔄 Tipo schedulazione e ciclo"
    show_header_toggle: false
    entities:
      - entity: input_select.rainvision_tipo_ciclo
        name: Tipo schedulazione
        icon: mdi:calendar-sync
      - entity: input_number.rainvision_ciclo_ore
        name: Ogni quante ore (se tipo = cycle)
        icon: mdi:refresh

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        name: "💾 Salva tipo"
        icon: mdi:calendar-sync
        show_state: false
        styles:
          card:
            - background: "#6a1b9a"
            - border-radius: 10px
            - padding: 12px
          name:
            - color: white
            - font-size: 12px
            - font-weight: bold
          icon:
            - color: white
            - width: 22px
        tap_action:
          action: call-service
          service: rainvision.set_program_cycle
          service_data:
            device_puid: "1000005059"
            program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
            cycle_hours: "[[[ return parseInt(states['input_number.rainvision_ciclo_ore'].state) ]]]"

      - type: custom:button-card
        name: "💾 Salva ciclo (ore)"
        icon: mdi:refresh-circle
        show_state: false
        styles:
          card:
            - background: "#e65100"
            - border-radius: 10px
            - padding: 12px
          name:
            - color: white
            - font-size: 12px
            - font-weight: bold
          icon:
            - color: white
            - width: 22px
        tap_action:
          action: call-service
          service: rainvision.set_program_cycle
          service_data:
            device_puid: "1000005059"
            program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
            cycle_hours: "[[[ return parseInt(states['input_number.rainvision_ciclo_ore'].state) ]]]"

  # ── Abilita / Disabilita programma ─────────────────────────────────────────
  - type: entities
    title: "⚡ Stato programmi"
    show_header_toggle: false
    entities:
      - entity: switch.pure_vision_ev_programma_a_prato
        name: "Programma A — Prato"
        icon: mdi:toggle-switch
      - entity: switch.pure_vision_ev_programma_b_piante
        name: "Programma B — Piante"
        icon: mdi:toggle-switch
      - entity: switch.pure_vision_ev_programma_c_orto
        name: "Programma C — Orto"
        icon: mdi:toggle-switch
      - entity: switch.pure_vision_ev_programma_d
        name: "Programma D"
        icon: mdi:toggle-switch
