# ─────────────────────────────────────────────────────────────────────────────
# Rain Vision — Edit Program Section
#
# Allows the user to modify irrigation program settings directly from the
# dashboard. Uses input helpers to select values, then dedicated save buttons
# to write changes via Rain Vision services.
#
# Requires:
#   - custom:button-card (HACS → Frontend)
#   - Input helpers (created via HA UI or helpers.yaml):
#       input_select.rainvision_programma      (A / B / C / D)
#       input_select.rainvision_zona           (1 / 2 / 4 / 8)
#       input_select.rainvision_tipo_ciclo     (cycle / weekdays)
#       input_number.rainvision_durata_min     (0–120 min)
#       input_number.rainvision_ciclo_ore      (1–168 h)
#       input_number.rainvision_time_index     (0–5)
#       input_text.rainvision_orario           (HH:MM)
# ─────────────────────────────────────────────────────────────────────────────

title: ✏️ Edit Program
type: grid
cards:

  # ── Header ───────────────────────────────────────────────────────────────────
  - type: custom:button-card
    name: "✏️ Edit Program"
    icon: mdi:pencil-circle
    show_state: false
    styles:
      card:
        - background: "linear-gradient(135deg, #1a3a20, #2d7a3a)"
        - color: white
        - font-size: 15px
        - font-weight: bold
        - padding: 14px
        - border-radius: 12px
      icon:
        - color: white
        - width: 26px

  # ── Program and zone selection ────────────────────────────────────────────────
  - type: entities
    title: "🎯 Select"
    show_header_toggle: false
    entities:
      - entity: input_select.rainvision_programma
        name: Program
        icon: mdi:calendar-clock
      - entity: input_select.rainvision_zona
        name: Zone (ID)
        icon: mdi:sprinkler

  # ── Live status of the selected program/zone ──────────────────────────────────
  # Shows the current values from the sensor attributes before editing.
  - type: custom:button-card
    name: "Current status"
    icon: mdi:information-outline
    show_state: false
    show_label: true
    label: >
      [[[
        const prog = states['input_select.rainvision_programma']?.state;
        if (!prog) return 'Select a program';
        const map = { A: 'a_prato', B: 'b_piante', C: 'c_orto', D: 'd' };
        const key = map[prog];
        const entity = states[`sensor.pure_vision_ev_programma_${key}`];
        if (!entity) return 'Sensor not found';
        const attrs = entity.attributes;
        const zona = states['input_select.rainvision_zona']?.state;
        const zoneMap = { '1': 0, '2': 1, '4': 2, '8': 3 };
        const zIdx = zoneMap[zona] ?? 0;
        const durMin = attrs[`zones_${zIdx}_duration_minutes`] ?? '?';
        const zoneName = attrs[`zones_${zIdx}_name`] ?? `Zone ${zona}`;
        return `Prog ${prog} | ${zoneName}: ${durMin} min | Cycle: ${attrs.cycle ?? '?'}h | ${entity.state}`;
      ]]]
    styles:
      card:
        - background: "#e8f5e9"
        - border: "1px solid #8dc63f"
        - border-radius: 10px
        - padding: 12px
      name:
        - font-size: 12px
        - color: "#2d7a3a"
        - font-weight: bold
      label:
        - font-size: 12px
        - color: "#1a3a20"
      icon:
        - color: "#8dc63f"
        - width: 20px

  # ── Zone duration ─────────────────────────────────────────────────────────────
  - type: entities
    title: "💧 Zone Duration"
    show_header_toggle: false
    entities:
      - entity: input_number.rainvision_durata_min
        name: Duration (minutes)
        icon: mdi:timer-outline

  - type: custom:button-card
    name: "💾 Save zone duration"
    icon: mdi:content-save
    show_state: false
    styles:
      card:
        - background: "#2d7a3a"
        - border-radius: 10px
        - padding: 12px
      name:
        - color: white
        - font-size: 13px
        - font-weight: bold
      icon:
        - color: white
        - width: 22px
    tap_action:
      action: call-service
      service: rainvision.set_zone_duration
      service_data:
        device_puid: "1000005059"
        program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
        zone_id: "[[[ return parseInt(states['input_select.rainvision_zona'].state) ]]]"
        duration_seconds: "[[[ return parseInt(states['input_number.rainvision_durata_min'].state) * 60 ]]]"

  # ── Start time ────────────────────────────────────────────────────────────────
  - type: entities
    title: "🕐 Start Time"
    show_header_toggle: false
    entities:
      - entity: input_text.rainvision_orario
        name: Time (HH:MM)
        icon: mdi:clock-outline
      - entity: input_number.rainvision_time_index
        name: Time slot (0–5)
        icon: mdi:numeric

  - type: custom:button-card
    name: "💾 Save start time"
    icon: mdi:clock-check
    show_state: false
    styles:
      card:
        - background: "#00838f"
        - border-radius: 10px
        - padding: 12px
      name:
        - color: white
        - font-size: 13px
        - font-weight: bold
      icon:
        - color: white
        - width: 22px
    tap_action:
      action: call-service
      service: rainvision.set_program_start_time
      service_data:
        device_puid: "1000005059"
        program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
        time_index: "[[[ return parseInt(states['input_number.rainvision_time_index'].state) ]]]"
        time: "[[[ return states['input_text.rainvision_orario'].state ]]]"
        active: true

  # ── Schedule type and cycle frequency ────────────────────────────────────────
  - type: entities
    title: "🔄 Schedule Type & Cycle"
    show_header_toggle: false
    entities:
      - entity: input_select.rainvision_tipo_ciclo
        name: Schedule type
        icon: mdi:calendar-sync
      - entity: input_number.rainvision_ciclo_ore
        name: Every N hours (if type = cycle)
        icon: mdi:refresh

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        name: "💾 Save type"
        icon: mdi:calendar-sync
        show_state: false
        styles:
          card:
            - background: "#6a1b9a"
            - border-radius: 10px
            - padding: 12px
          name:
            - color: white
            - font-size: 12px
            - font-weight: bold
          icon:
            - color: white
            - width: 22px
        tap_action:
          action: call-service
          service: rainvision.set_program_cycle
          service_data:
            device_puid: "1000005059"
            program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
            cycle_hours: "[[[ return parseInt(states['input_number.rainvision_ciclo_ore'].state) ]]]"

      - type: custom:button-card
        name: "💾 Save cycle (h)"
        icon: mdi:refresh-circle
        show_state: false
        styles:
          card:
            - background: "#e65100"
            - border-radius: 10px
            - padding: 12px
          name:
            - color: white
            - font-size: 12px
            - font-weight: bold
          icon:
            - color: white
            - width: 22px
        tap_action:
          action: call-service
          service: rainvision.set_program_cycle
          service_data:
            device_puid: "1000005059"
            program: "[[[ return states['input_select.rainvision_programma'].state ]]]"
            cycle_hours: "[[[ return parseInt(states['input_number.rainvision_ciclo_ore'].state) ]]]"

  # ── Program enable / disable toggles ─────────────────────────────────────────
  - type: entities
    title: "⚡ Program Status"
    show_header_toggle: false
    entities:
      - entity: switch.pure_vision_ev_programma_a_prato
        name: "Program A — Lawn"
        icon: mdi:toggle-switch
      - entity: switch.pure_vision_ev_programma_b_piante
        name: "Program B — Plants"
        icon: mdi:toggle-switch
      - entity: switch.pure_vision_ev_programma_c_orto
        name: "Program C — Garden"
        icon: mdi:toggle-switch
      - entity: switch.pure_vision_ev_programma_d
        name: "Program D"
        icon: mdi:toggle-switch
