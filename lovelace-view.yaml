title: Irrigazione
path: irrigazione
type: sections
sections:
  - title: 🌱 Programma A — Prato
    type: grid
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(3, 1fr)
          grid-template-rows: auto
          gap: 8px
        cards:

          # ── Intestazione ─────────────────────────────────────────────────────────
          - type: custom:button-card
            name: "Programma A — Prato"
            icon: mdi:calendar-clock
            show_state: false
            view_layout:
              grid-column: 1 / -1
            styles:
              card:
                - background: "#1a3a20"
                - color: "#8dc63f"
                - font-size: 15px
                - font-weight: bold
                - padding: 12px 16px
                - border-radius: 12px
              icon:
                - color: "#8dc63f"
                - width: 24px

          # ── Prossimo avvio ────────────────────────────────────────────────────────
          - type: custom:button-card
            entity: sensor.pure_vision_ev_programma_a_prato
            name: "Prossimo avvio"
            show_state: true
            icon: mdi:clock-start
            view_layout:
              grid-column: 1 / -1
            styles:
              card:
                - background: "#e8f5e9"
                - border: "1px solid #8dc63f"
                - border-radius: 10px
                - padding: 10px
              name:
                - font-size: 11px
                - color: "#2d7a3a"
              state:
                - font-size: 18px
                - font-weight: bold
                - color: "#1a3a20"
              icon:
                - color: "#8dc63f"
                - width: 24px

          # ── SEZIONE: Impostazioni ─────────────────────────────────────────────────
          - type: custom:button-card
            name: "⚙️ Impostazioni"
            show_state: false
            icon: mdi:cog
            view_layout:
              grid-column: 1 / -1
            styles:
              card:
                - background: "#37474f"
                - color: white
                - font-size: 12px
                - font-weight: bold
                - padding: 6px 12px
                - border-radius: 8px
              icon:
                - color: white
                - width: 16px

          - type: custom:button-card
            name: "Tipo"
            show_label: true
            show_state: false
            icon: mdi:cog
            label: >
              [[[ return states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.type ?? '—' ]]]
            styles:
              card:
                - background: "#f5f5f5"
                - border: "1px solid #dddddd"
                - border-radius: 10px
                - padding: 12px 6px
              name:
                - font-size: 11px
                - color: "#777777"
              label:
                - font-size: 14px
                - font-weight: bold
                - color: "#333333"
              icon:
                - color: "#aaaaaa"
                - width: 20px

          - type: custom:button-card
            name: "Ciclo"
            show_label: true
            show_state: false
            icon: mdi:refresh
            label: >
              [[[ return (states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.cycle ?? '—') + ' h' ]]]
            styles:
              card:
                - background: "#fff8e1"
                - border: "1px solid #f9a825"
                - border-radius: 10px
                - padding: 12px 6px
              name:
                - font-size: 11px
                - color: "#e65100"
              label:
                - font-size: 14px
                - font-weight: bold
                - color: "#e65100"
              icon:
                - color: "#f9a825"
                - width: 20px

          - type: custom:button-card
            name: "Durata totale"
            show_label: true
            show_state: false
            icon: mdi:timer-outline
            label: >
              [[[ return (states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.total_duration_minutes ?? '—') + ' min' ]]]
            styles:
              card:
                - background: "#e3f2fd"
                - border: "1px solid #00b5e2"
                - border-radius: 10px
                - padding: 12px 6px
              name:
                - font-size: 11px
                - color: "#00838f"
              label:
                - font-size: 14px
                - font-weight: bold
                - color: "#00838f"
              icon:
                - color: "#00b5e2"
                - width: 20px

          # ── SEZIONE: Orari ────────────────────────────────────────────────────────
