                - font-size: 12px
                - font-weight: bold
                - padding: 6px 12px
                - border-radius: 8px
              icon:
                - color: white
                - width: 16px

          - type: custom:button-card
            name: "Orario 1"
            show_label: true
            show_state: false
            icon: mdi:clock-outline
            label: >
              [[[
                const attrs = states['sensor.pure_vision_ev_programma_a_prato']?.attributes;
                const t = attrs?.times_0_time ?? '—';
                const a = attrs?.times_0_active ? '✓' : '✗';
                return `${t} ${a}`;
              ]]]
            styles:
              card:
                - background: >
                    [[[
                      const active = states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.times_0_active;
                      return active ? '#e8f5e9' : '#f5f5f5';
                    ]]]
                - border: >
                    [[[
                      const active = states['sensor.pure_vision_ev_programma_a_prato']?.attributes?.times_0_active;
                      return active ? '1px solid #8dc63f' : '1px solid #dddddd';
